<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arkade Wallet Providers Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 2rem; }
    h1 { margin-bottom: 1rem; color: #fff; }
    .providers { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .provider-card {
      background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 1.5rem;
    }
    .provider-card h3 { margin-bottom: 0.5rem; }
    .provider-card .status { font-size: 0.85rem; color: #888; margin-bottom: 1rem; }
    .provider-card .status.detected { color: #4ade80; }
    .provider-card .info { font-size: 0.8rem; color: #aaa; word-break: break-all; margin: 0.5rem 0; }
    button {
      background: #2563eb; color: white; border: none; padding: 0.5rem 1rem;
      border-radius: 4px; cursor: pointer; margin: 0.25rem; font-size: 0.85rem;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }
    #log {
      background: #111; border: 1px solid #333; border-radius: 8px;
      padding: 1rem; max-height: 400px; overflow-y: auto; font-family: monospace;
      font-size: 0.8rem; line-height: 1.5;
    }
    .log-entry { padding: 2px 0; }
    .log-entry.error { color: #f87171; }
    .log-entry.success { color: #4ade80; }
    .log-entry.info { color: #60a5fa; }
  </style>
</head>
<body>
  <h1>Arkade Wallet Providers Test</h1>
  <p style="color:#888; margin-bottom:1.5rem">Detects browser wallet extensions and tests signing capabilities. Target: <b>signet</b></p>
  <div class="providers" id="providers"></div>
  <h2 style="margin-bottom:0.5rem">Log</h2>
  <div id="log"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
